<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-label="pi-starter POST /chat SSE lifecycle">
  <title>POST /chat SSE lifecycle</title>
  <desc>Sequence diagram: HTTP client → Express app → agent session → extensions (guard / audit) → tool → SSE translator → back to client. Event names and preview limit are read from src/sse.ts and src/app.ts at generation time.</desc>
  <style>
    svg { background: #0f172a; }
    text { paint-order: stroke fill; }
  </style>
  <rect x="0" y="0" width="1040" height="640" fill="#0f172a"/>
  <rect x="50" y="30" width="140" height="44" rx="8" fill="#0b1224" stroke="#38bdf8" stroke-width="1.2"/><text x="120" y="50" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Client</text><line x1="120" y1="74" x2="120" y2="580" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>
<rect x="210" y="30" width="140" height="44" rx="8" fill="#0b1224" stroke="#22c55e" stroke-width="1.2"/><text x="280" y="50" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#22c55e" text-anchor="middle">Express app · src/app.ts</text><line x1="280" y1="74" x2="280" y2="580" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>
<rect x="370" y="30" width="140" height="44" rx="8" fill="#0b1224" stroke="#facc15" stroke-width="1.2"/><text x="440" y="50" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#facc15" text-anchor="middle">Agent session (SDK)</text><line x1="440" y1="74" x2="440" y2="580" stroke="#facc15" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>
<rect x="530" y="30" width="140" height="44" rx="8" fill="#0b1224" stroke="#f472b6" stroke-width="1.2"/><text x="600" y="50" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">Extensions (guard · audit)</text><line x1="600" y1="74" x2="600" y2="580" stroke="#f472b6" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>
<rect x="690" y="30" width="140" height="44" rx="8" fill="#0b1224" stroke="#fb923c" stroke-width="1.2"/><text x="760" y="50" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle">Tool (src/tools/*)</text><line x1="760" y1="74" x2="760" y2="580" stroke="#fb923c" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>
<rect x="850" y="30" width="140" height="44" rx="8" fill="#0b1224" stroke="#a78bfa" stroke-width="1.2"/><text x="920" y="50" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">SSE translator · src/sse.ts</text><line x1="920" y1="74" x2="920" y2="580" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>
  <text x="520" y="540" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Request lifecycle</text>
  <defs><marker id="mk_110_0_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker></defs><line x1="120" y1="110" x2="280" y2="110" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#mk_110_0_1)"/><text x="200" y="102" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#38bdf8" text-anchor="middle">POST /chat { message }</text><text x="200" y="128" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">Content-Type: application/json</text><path d="M 280 152 q 60 0 60 20 q 0 20 -60 20" stroke="#22c55e" fill="none" stroke-width="1.6" marker-end="url(#mk_self_152)"/><defs><marker id="mk_self_152" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker></defs><text x="288" y="186" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#22c55e" text-anchor="start">busy? → 429</text><defs><marker id="mk_204_1_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker></defs><line x1="280" y1="204" x2="440" y2="204" stroke="#22c55e" stroke-width="1.6" marker-end="url(#mk_204_1_2)"/><text x="360" y="196" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#22c55e" text-anchor="middle">session.prompt(userMessage)</text><defs><marker id="mk_246_2_3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker></defs><line x1="440" y1="246" x2="600" y2="246" stroke="#facc15" stroke-width="1.6" marker-end="url(#mk_246_2_3)"/><text x="520" y="238" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#facc15" text-anchor="middle">event: tool_call</text><text x="520" y="264" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">pi.on("tool_call", …) → { block?, mutate? }</text><defs><marker id="mk_288_3_4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker></defs><line x1="600" y1="288" x2="760" y2="288" stroke="#f472b6" stroke-width="1.6" marker-end="url(#mk_288_3_4)"/><text x="680" y="280" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#f472b6" text-anchor="middle">allowed → execute tool</text><defs><marker id="mk_330_4_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker></defs><line x1="760" y1="330" x2="440" y2="330" stroke="#fb923c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#mk_330_4_2)"/><text x="600" y="322" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#fb923c" text-anchor="middle">tool result</text><text x="600" y="348" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">text preview capped at 500 chars</text><defs><marker id="mk_372_2_3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker></defs><line x1="440" y1="372" x2="600" y2="372" stroke="#facc15" stroke-width="1.6" marker-end="url(#mk_372_2_3)"/><text x="520" y="364" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#facc15" text-anchor="middle">event: tool_result</text><text x="520" y="390" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">pi.on("tool_result", …) → rewrite?</text><defs><marker id="mk_414_2_5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker></defs><line x1="440" y1="414" x2="920" y2="414" stroke="#facc15" stroke-width="1.6" marker-end="url(#mk_414_2_5)"/><text x="680" y="406" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#facc15" text-anchor="middle">message_update / tool_execution_*</text><path d="M 920 456 q 60 0 60 20 q 0 20 -60 20" stroke="#a78bfa" fill="none" stroke-width="1.6" marker-end="url(#mk_self_456)"/><defs><marker id="mk_self_456" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs><text x="928" y="490" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#a78bfa" text-anchor="start">translateEvent(event)</text><defs><marker id="mk_508_5_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs><line x1="920" y1="508" x2="120" y2="508" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#mk_508_5_0)"/><text x="520" y="500" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#a78bfa" text-anchor="middle">SSE frames</text><text x="520" y="526" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">data: {type,data}\n\n</text>
