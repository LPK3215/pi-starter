<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="pi-starter knowledge retrieval">
  <title>pi-starter knowledge retrieval</title>
  <desc>Pluggable knowledge retrieval: the search_knowledge tool and REST /knowledge/search share one Retriever. KeywordRetriever is the zero-dependency default; VectorRetriever (opt-in) composes an EmbeddingProvider and a VectorStore. Backend class names are read from source at generation time.</desc>
  <style>svg { background: #0f172a; } text { paint-order: stroke fill; }</style>
  <defs><marker id="rh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker></defs>
  <rect x="0" y="0" width="900" height="470" fill="#0f172a"/>
  <rect x="20" y="20" width="860" height="46" rx="12" fill="#0b1224" stroke="#38bdf8" stroke-width="1.2"/><text x="40" y="50" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="700" fill="#38bdf8" text-anchor="start">Knowledge retrieval · pluggable behind the Retriever interface</text><text x="860" y="50" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="end">default: keyword (zero-dep)  ·  opt-in: vector RAG</text><rect x="120" y="92" width="300" height="44" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/><text x="270" y="112" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#22c55e" text-anchor="middle">search_knowledge</text><text x="270" y="128" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">SDK tool (official RAG entry)</text><rect x="480" y="92" width="300" height="44" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/><text x="630" y="112" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#22c55e" text-anchor="middle">GET /knowledge/search</text><text x="630" y="128" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">REST (same retriever, single source)</text><rect x="250" y="168" width="400" height="40" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.2"/><text x="450" y="193" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="400" fill="#facc15" text-anchor="middle">interface Retriever { kind; search(query, limit) }</text><rect x="90" y="238" width="320" height="44" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/><text x="250" y="258" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">KeywordRetriever  ·  default</text><text x="250" y="274" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">in-process keyword scoring</text><rect x="490" y="238" width="320" height="44" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/><text x="650" y="258" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">VectorRetriever  ·  PI_KNOWLEDGE_RETRIEVAL=vector</text><text x="650" y="274" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">chunk → embed → cosine → aggregate by doc</text><rect x="360" y="320" width="250" height="34" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/><text x="485" y="342" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">EmbeddingProvider</text><rect x="640" y="320" width="220" height="34" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/><text x="750" y="342" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">VectorStore</text><rect x="300" y="372" width="340" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/><text x="314" y="392" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="start">implementations:</text><text x="328" y="408" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">• OpenAICompatEmbeddings</text><text x="328" y="424" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">• OllamaEmbeddings</text><text x="328" y="440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">• TransformersEmbeddings</text><rect x="660" y="372" width="210" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/><text x="674" y="392" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="start">implementations:</text><text x="688" y="408" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">• InMemoryVectorStore</text><text x="688" y="424" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">• SqliteVectorStore</text><line x1="270" y1="136" x2="420" y2="168" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#rh)"/><line x1="630" y1="136" x2="480" y2="168" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#rh)"/><line x1="400" y1="208" x2="250" y2="238" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#rh)"/><line x1="500" y1="208" x2="650" y2="238" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#rh)"/><line x1="600" y1="282" x2="485" y2="320" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#rh)"/><line x1="700" y1="282" x2="750" y2="320" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#rh)"/><line x1="485" y1="354" x2="470" y2="372" stroke="#f472b6" stroke-width="1.5" marker-end="url(#rh)"/><line x1="750" y1="354" x2="765" y2="372" stroke="#f472b6" stroke-width="1.5" marker-end="url(#rh)"/>
</svg>
