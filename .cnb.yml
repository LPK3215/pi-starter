# CNB 流水线（cnb.cool）。GitHub Actions 在本仓因账号计费锁定跑不起来（见
# pipeline.config.json 的 _localPublish说明），所以远端门禁由这里承担——
# 这里漏掉什么，就等于那件事在远端**永远没有**回归保护。
#
# 对齐 .github/workflows/ci.yml 的作业划分：
#   1. verify   —— typecheck + lint:unused + test + test:web + docs:check + smoke + build + verify:embed
#   2. coverage —— 覆盖率棘轮阈值（scripts/coverage.mjs，零依赖，Node 内置覆盖率）
#   3. e2e      —— 真进程 / 真 SIGKILL / 真重启恢复（Actions 有、这里原先没有）
#   4. audit    —— 高危依赖通告闸门（同上）
#   5. frontend —— lint + official-check + build + audit，仅在 web/** 变更时触发
#
# verify 链里的 audit 与 frontend 的 audit 口径一致：生产依赖必须 0 高危，开发依赖走基线化
# 门禁（web/scripts/check-audit.mjs + web/scripts/audit-baseline.json）。
#
# 前四条串在同一条流水线里：它们都只依赖根的 node_modules，`npm ci` 一次即可。
# 前端刻意拆成独立 Pipeline 并用 `ifModify` 收窄触发面——它要装 web/ 自己那两万多个文件，
# 不该让每个后端 PR 都等它。

.verify-chain: &verify-chain
  name: verify
  docker:
    image: node:24
  stages:
    - name: install
      script: npm ci
    - name: verify
      # 已含 docs:check（README 的数字与 docs/参考手册.md 都是生成的，漂移即失败）。
      script: npm run verify
    - name: coverage
      # 覆盖率是**棘轮阈值**（scripts/coverage.mjs，只允许往上调），与 verify 里的 npm test
      # 是两次运行：本地跑 verify 要快，远端要门禁，代价换来的是"覆盖率下降"也会被挡住。
      script: npm run test:coverage
    - name: e2e
      # 真进程：握手 → 跑完一轮 → SIGKILL → 重启 → 断言会话从磁盘恢复。同进程的替身
      # 抓不到"何时/如何写会话转录"这类 SDK 升级引入的变化。
      script: npm run e2e
    - name: audit
      # 只有 5 个运行时依赖，把高危通告当闸门而不是"想起来才跑一次扫描"。
      # 钉住公共 registry：部分镜像没实现 advisories 端点，会 404 让每次构建都红。
      script: npm audit --audit-level=high --registry=https://registry.npmjs.org

.frontend-check: &frontend-check
  name: frontend
  ifModify:
    - web/**
    # 前端把 src/protocol.ts 别名成 @pi/protocol，改后端协议同样要重编前端。
    - src/protocol.ts
  docker:
    image: node:24
  stages:
    - name: install
      script: npm ci --prefix web
    - name: lint
      script: npm --prefix web run lint
    - name: check official components
      # 基线化检查：只对**新增**偏离报错（已知偏离登记在 web/scripts/registry-baseline.json）。
      # `:ci` 变体在拉不到上游 registry 时按跳过处理并退出 0，不把网络抖动当内容问题。
      script: npm --prefix web run check:official:ci
    - name: build
      script: npm --prefix web run build
    - name: audit
      # web/ 有自己的 lockfile；只审计根包等于前端依赖完全没人管。
      # 用 check:audit:ci 而不是裸 npm audit：裸命令会因为一条**无可用修复**的开发依赖
      # 通告恒红，而恒红的闸门等于没有闸门。check:audit 的做法是「生产依赖 0 高危（硬门）
      # + 开发依赖里的已知通告登记在 audit-baseline.json、只对新增报错」。
      script: npm --prefix web run check:audit:ci

main:
  pull_request:
    verify: *verify-chain
    frontend: *frontend-check
  push:
    verify: *verify-chain
    frontend: *frontend-check
