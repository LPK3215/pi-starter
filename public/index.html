<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Starter · Agent 对话</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
      background: #f5f6fa; color: #2d3436; height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #1e272e; color: #fff; padding: 14px 20px; font-weight: 600;
      display: flex; align-items: center; gap: 8px; font-size: 15px;
    }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: #27ae60; display: inline-block; }
    header select {
      margin-left: auto; background: #2d3436; color: #fff; border: 1px solid #57606f;
      border-radius: 6px; padding: 4px 8px; font-size: 13px;
    }
    main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #4a69bd; color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
    .msg.thinking { align-self: flex-start; background: #fff8e1; border: 1px solid #f0d9a0; color: #6d5d1b; font-size: 13px; }
    .msg.tool { align-self: flex-start; background: #e8f5e9; border: 1px solid #a5d6a7; color: #2e7d32; font-size: 13px; font-family: monospace; }
    .msg.error { align-self: flex-start; background: #ffebee; border: 1px solid #ef9a9a; color: #c62828; }
    .typing { align-self: flex-start; color: #999; font-size: 13px; }
    footer { padding: 12px 20px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
    input {
      flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none;
    }
    input:focus { border-color: #4a69bd; }
    button {
      padding: 10px 22px; background: #4a69bd; color: #fff; border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer; font-weight: 600;
    }
    button:disabled { background: #bbb; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span> Pi Starter · Agent 对话（SSE 流式）
    <select id="model" title="切换模型"></select>
  </header>
  <main id="messages"></main>
  <footer>
    <input id="input" type="text" placeholder="输入消息，回车发送" autocomplete="off" />
    <button id="send">发送</button>
  </footer>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelEl = document.getElementById("model");

    function modelRef(item) {
      return `${item.provider}/${item.id}`;
    }

    async function loadModels() {
      const res = await fetch("/health");
      const data = await res.json();
      modelEl.replaceChildren();
      for (const item of data.models ?? []) {
        const option = document.createElement("option");
        option.value = modelRef(item);
        option.textContent = item.name ? `${modelRef(item)}（${item.name}）` : modelRef(item);
        option.selected = item.current;
        modelEl.appendChild(option);
      }
    }

    modelEl.addEventListener("change", async () => {
      modelEl.disabled = true;
      try {
        const res = await fetch("/model", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: modelEl.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error ?? "切换失败");
        addMsg("tool", `✅ 已切换到 ${data.model}`);
      } catch (err) {
        addMsg("error", "❌ " + err.message);
        await loadModels();
      } finally {
        modelEl.disabled = false;
      }
    });

    loadModels().catch((err) => addMsg("error", "❌ 读取模型列表失败：" + err.message));

    function addMsg(type, text) {
      const el = document.createElement("div");
      el.className = `msg ${type}`;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    async function send() {
      const message = inputEl.value.trim();
      if (!message) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      addMsg("user", message);

      let answerEl = null;
      let thinkingEl = null;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          addMsg("error", `HTTP ${res.status}: ${err.error ?? "未知错误"}`);
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop() ?? "";
          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data: ")) continue;
            const { type, data } = JSON.parse(line.slice(6));
            switch (type) {
              case "text":
                thinkingEl = null;
                if (!answerEl) answerEl = addMsg("assistant", "");
                answerEl.textContent += data.delta;
                messagesEl.scrollTop = messagesEl.scrollHeight;
                break;
              case "thinking":
                answerEl = null;
                if (!thinkingEl) thinkingEl = addMsg("thinking", "🤔 ");
                thinkingEl.textContent += data.delta;
                messagesEl.scrollTop = messagesEl.scrollHeight;
                break;
              case "tool_start":
                answerEl = null;
                thinkingEl = null;
                addMsg("tool", `🔧 [${data.name}] ${JSON.stringify(data.args ?? {})}`);
                break;
              case "tool_end": {
                const mark = data.isError ? "❌" : "✅";
                const preview = data.result.length > 120 ? data.result.slice(0, 120) + "…" : data.result;
                addMsg("tool", `${mark} [${data.name}] ${preview}`);
                break;
              }
              case "error":
                addMsg("error", "❌ " + data.message);
                break;
              case "done":
                break;
            }
          }
        }
      } catch (err) {
        addMsg("error", "❌ " + err.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    inputEl.focus();
  </script>
</body>
</html>
