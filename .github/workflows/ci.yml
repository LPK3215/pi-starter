name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # engines.node is >=22.19 (needs node:sqlite).
        node-version: ['22.19', '22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (unused symbols)
        # Dead code is how "declared but never wired" bugs survive review; make the
        # compiler fail on them.
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Test
        # Contract smoke tests: no model calls, no ~/.pi/agent writes.
        run: npm test

      - name: Test (frontend WS client)
        # Frontend's first tests: cross-conversation frame filtering and friends.
        # Reuses the root tsx and needs no web/node_modules — client.ts only depends
        # on @pi/protocol (aliased to src/protocol.ts), not on React/DOM.
        run: npm run test:web

      - name: Runtime smoke (WebSocket end-to-end)
        # Exercises the real transport: frame ordering, pending-queue replay,
        # origin checks, backpressure-driven disconnect.
        run: npm run smoke

      - name: E2E (real process, real restart, session resume)
        # The layer that matters most when the SDK is upgraded: it spawns actual
        # server processes against a local fake OpenAI endpoint (no API key, no
        # network), runs a turn, SIGKILLs the process, restarts it and asserts the
        # conversation comes back off disk. Same-process fakes cannot catch a
        # change in when/how the session transcript is written.
        run: npm run e2e

      - name: Dependency audit
        # 5 runtime deps keeps the surface small; gate the build on a high-severity
        # advisory instead of leaving it to a periodic scan someone has to remember.
        # Pinned to the public registry: some mirrors don't implement the advisories
        # endpoint and would otherwise fail every build with a 404.
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-node${{ matrix.node-version }}-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  frontend:
    # 前端在此之前完全没有被 CI 覆盖（既不 typecheck 也不 build），一个独立作业即可补上。
    # 只跑 lint 与 typecheck+build：`npm --prefix web run check:official` 当前**退出码为 1**
    # （官方 registry 组件已有 11 处不同 / 3 处缺失），放进 CI 会把流水线变红——
    # 那是需要单独决策的对齐工作，不是门禁。
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          # 前端是独立 package，缓存要指向它自己的 lockfile。
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Lint
        run: npm --prefix web run lint

      - name: Typecheck + build
        run: npm --prefix web run build

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
