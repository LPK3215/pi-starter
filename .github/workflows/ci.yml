name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # engines.node is >=22.19 (needs node:sqlite).
        node-version: ['22.19', '22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (unused symbols)
        # Dead code is how "declared but never wired" bugs survive review; make the
        # compiler fail on them.
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Test (with coverage gate)
        # Contract smoke tests: no model calls, no ~/.pi/agent writes.
        # Runs the suite once and enforces the ratchet thresholds from
        # scripts/coverage.mjs — no c8/nyc dependency, no second test run.
        run: npm run test:coverage

      - name: Test (frontend WS client)
        # Frontend's first tests: cross-conversation frame filtering and friends.
        # Reuses the root tsx and needs no web/node_modules — client.ts only depends
        # on @pi/protocol (aliased to src/protocol.ts), not on React/DOM.
        run: npm run test:web

      - name: Runtime smoke (WebSocket end-to-end)
        # Exercises the real transport: frame ordering, pending-queue replay,
        # origin checks, backpressure-driven disconnect.
        run: npm run smoke

      - name: E2E (real process, real restart, session resume)
        # The layer that matters most when the SDK is upgraded: it spawns actual
        # server processes against a local fake OpenAI endpoint (no API key, no
        # network), runs a turn, SIGKILLs the process, restarts it and asserts the
        # conversation comes back off disk. Same-process fakes cannot catch a
        # change in when/how the session transcript is written.
        run: npm run e2e

      - name: Dependency audit
        # 5 runtime deps keeps the surface small; gate the build on a high-severity
        # advisory instead of leaving it to a periodic scan someone has to remember.
        # Pinned to the public registry: some mirrors don't implement the advisories
        # endpoint and would otherwise fail every build with a 404.
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Generated docs are up to date
        # README's verifiable counts and docs/参考手册.md (protocol / REST / tools / env) are
        # generated from source. Without this step they silently rot back into hand-written lies.
        run: npm run docs:check

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-node${{ matrix.node-version }}-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  frontend:
    # 前端在此之前完全没有被 CI 覆盖（既不 typecheck 也不 build），一个独立作业即可补上。
    # 组件与官方 registry 的比对也在这里：它已改为**基线化**检查（已知偏离登记在
    # web/scripts/registry-baseline.json），只有**新增**偏离才失败，因此可以当门禁用。
    name: Frontend (lint + official-check + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          # 前端是独立 package，缓存要指向它自己的 lockfile。
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Lint
        run: npm --prefix web run lint

      - name: Official component sync
        # 基线化：只对**新增**偏离报错（`--tolerate-network` 让"拉不到上游 registry"按跳过
        # 处理并退出 0，避免网络抖动被误判成内容问题）。
        run: npm --prefix web run check:official:ci

      - name: Typecheck + build
        run: npm --prefix web run build

      - name: Dependency audit (frontend)
        # web/ has its own lockfile and its own dependency tree; auditing only the root
        # package left the frontend uncovered entirely.
        # Uses check:audit rather than a bare `npm audit`: one high advisory in the tree
        # (braces via shadcn) has no available fix and would keep this job red forever.
        # check:audit keeps a hard gate (production deps must be 0 high) plus a checked-in
        # baseline (web/scripts/audit-baseline.json) so only NEW advisories fail.
        run: npm --prefix web run check:audit:ci

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
